<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Subtle cyan glow filter -->
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Badge Surface matching Header Logo -->
  <circle cx="32" cy="32" r="30" fill="#1b1f2b" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
  <circle cx="32" cy="32" r="28" fill="#141722" />

  <!-- Dots Group (AuraFocus blur_on dot matrix) -->
  <g fill="#f1f2f6" filter="url(#auraGlow)">
    <!-- Row 0 (top row: 2 outer dots) -->
    <circle cx="28.5" cy="15" r="1.4" />
    <circle cx="35.5" cy="15" r="1.4" />

    <!-- Row 1 (4 dots) -->
    <circle cx="21.5" cy="21.5" r="1.6" />
    <circle cx="28.5" cy="21.5" r="2.2" />
    <circle cx="35.5" cy="21.5" r="2.2" />
    <circle cx="42.5" cy="21.5" r="1.6" />

    <!-- Row 2 (6 dots: outer, mid, inner hero) -->
    <circle cx="14.5" cy="28.5" r="1.4" />
    <circle cx="21.5" cy="28.5" r="2.2" />
    <circle cx="28.5" cy="28.5" r="3.2" fill="#ffffff" />
    <circle cx="35.5" cy="28.5" r="3.2" fill="#ffffff" />
    <circle cx="42.5" cy="28.5" r="2.2" />
    <circle cx="49.5" cy="28.5" r="1.4" />

    <!-- Row 3 (6 dots: outer, mid, inner hero) -->
    <circle cx="14.5" cy="35.5" r="1.4" />
    <circle cx="21.5" cy="35.5" r="2.2" />
    <circle cx="28.5" cy="35.5" r="3.2" fill="#ffffff" />
    <circle cx="35.5" cy="35.5" r="3.2" fill="#ffffff" />
    <circle cx="42.5" cy="35.5" r="2.2" />
    <circle cx="49.5" cy="35.5" r="1.4" />

    <!-- Row 4 (4 dots) -->
    <circle cx="21.5" cy="42.5" r="1.6" />
    <circle cx="28.5" cy="42.5" r="2.2" />
    <circle cx="35.5" cy="42.5" r="2.2" />
    <circle cx="42.5" cy="42.5" r="1.6" />

    <!-- Row 5 (bottom row: 2 outer dots) -->
    <circle cx="28.5" cy="49" r="1.4" />
    <circle cx="35.5" cy="49" r="1.4" />
  </g>
</svg>