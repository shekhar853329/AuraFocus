<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="auroraGlow" cx="20%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#38e1ff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#08090c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="accentGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ffc478" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#08090c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1f2b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#12141a" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f2f6" />
      <stop offset="100%" stop-color="#38e1ff" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="630" fill="#08090c" />
  <rect width="1200" height="630" fill="url(#auroraGlow)" />
  <rect width="1200" height="630" fill="url(#accentGlow)" />

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Central Glow Preview Clock Mockup -->
  <g transform="translate(680, 150)" filter="url(#softShadow)">
    <rect width="440" height="310" rx="24" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <!-- Clock Digits inside Card -->
    <text x="220" y="150" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="76" font-weight="700" text-anchor="middle" letter-spacing="-2">
      10<tspan fill="#38e1ff">:42</tspan>
    </text>
    <text x="220" y="195" fill="#8b95a5" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="3">
      TUESDAY • OCTOBER 18
    </text>
    <!-- Focus pill -->
    <rect x="130" y="230" width="180" height="36" rx="18" fill="rgba(56, 225, 255, 0.12)" stroke="rgba(56, 225, 255, 0.3)" stroke-width="1" />
    <circle cx="152" cy="248" r="4" fill="#38e1ff" />
    <text x="228" y="254" fill="#38e1ff" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      25M FOCUS SESSION
    </text>
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(100, 150)">
    <!-- Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="36" rx="18" fill="rgba(27, 31, 43, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <circle cx="20" cy="18" r="5" fill="#38e1ff" />
      <text x="36" y="23" fill="#8b95a5" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">
        LIVING SCREENSAVER
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="105" fill="url(#textGrad)" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">
      AuraFocus
    </text>

    <!-- Tagline -->
    <text x="0" y="155" fill="#f1f2f6" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="500">
      Living Canvas, Ambient Soundscapes
    </text>
    <text x="0" y="190" fill="#8b95a5" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400">
      &amp; Aesthetic Desk Clock Hub
    </text>

    <!-- Bullet Features / Pills -->
    <g transform="translate(0, 245)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="38" rx="19" fill="#1b1f2b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="67" y="24" fill="#f1f2f6" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
        Flip &amp; Digital
      </text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="155" height="38" rx="19" fill="#1b1f2b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="222" y="24" fill="#f1f2f6" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
        Procedural Audio
      </text>

      <!-- Pill 3 -->
      <rect x="310" y="0" width="145" height="38" rx="19" fill="#1b1f2b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="382" y="24" fill="#f1f2f6" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
        Pomodoro Mode
      </text>
    </g>
  </g>

  <!-- Footer Branding -->
  <text x="100" y="565" fill="#586274" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="500">
    aurafocus.app • Free, open-source &amp; privacy-first
  </text>
</svg>
